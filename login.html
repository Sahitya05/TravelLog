<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TravelLog</title>
    <meta name="description" content="Sign in to your TravelLog account">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">
    <!-- Floating Particles Background -->
    <div class="particles" id="particles"></div>

    <header>
        <div class="header-container" style="justify-content: center;">
            <div class="header-brand">
                <div style="text-align: center;">
                    <h1>TravelLog</h1>
                    <p class="header-tagline">Document, Track, Share Your Adventures</p>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Login Section -->
        <section id="login" class="active">
            <div class="auth-container">
                <h2>Welcome Back!</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password"
                            required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>

                <div class="social-login">
                    <button type="button" class="social-btn" id="googleLogin">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button type="button" class="social-btn" id="facebookLogin">
                        <i class="fab fa-facebook"></i> Facebook
                    </button>
                </div>

                <div style="text-align: center; margin-top: var(--spacing-md);">
                    <a href="#" id="forgotPassword"
                        style="color: var(--color-primary); text-decoration: none; font-size: 0.9rem;">
                        Forgot Password?
                    </a>
                </div>

                <div class="auth-toggle">
                    Don't have an account?
                    <a href="#" id="showSignup">Sign Up</a>
                </div>
            </div>
        </section>

        <!-- Signup Section -->
        <section id="signup">
            <div class="auth-container">
                <h2>Create Account</h2>
                <form id="signupForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-input" id="signupFirstName" placeholder="John" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-input" id="signupLastName" placeholder="Doe" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" id="signupUsername" placeholder="johndoe" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="signupEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="signupPassword"
                            placeholder="Create a strong password" required minlength="6">
                        <div id="passwordStrength" style="margin-top: 4px; font-size: 0.85rem;"></div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-user-plus"></i> Sign Up
                    </button>
                </form>

                <div class="auth-toggle">
                    Already have an account?
                    <a href="#" id="showLogin">Login</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Show/hide sections
        function showSection(sectionId) {
            document.querySelectorAll('section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
        }

        // Login form
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (email && password) {
                // Store user info
                localStorage.setItem('loggedIn', 'true');
                localStorage.setItem('userEmail', email);

                // Show success message
                const toast = document.createElement('div');
                toast.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
                    color: white;
                    padding: 1rem 1.5rem;
                    border-radius: 12px;
                    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
                    z-index: 10000;
                    font-weight: 600;
                `;
                toast.textContent = 'Login successful!';
                document.body.appendChild(toast);

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            }
        });

        // Signup form
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const firstName = document.getElementById('signupFirstName').value;
            const lastName = document.getElementById('signupLastName').value;
            const username = document.getElementById('signupUsername').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            if (firstName && lastName && username && email && password) {
                // Store user info
                localStorage.setItem('userFirstName', firstName);
                localStorage.setItem('userLastName', lastName);
                localStorage.setItem('userUsername', username);
                localStorage.setItem('userEmail', email);

                // Show success message
                const toast = document.createElement('div');
                toast.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
                    color: white;
                    padding: 1rem 1.5rem;
                    border-radius: 12px;
                    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
                    z-index: 10000;
                    font-weight: 600;
                `;
                toast.textContent = 'Account created! Redirecting to login...';
                document.body.appendChild(toast);

                setTimeout(() => {
                    showSection('login');
                    document.getElementById('loginEmail').value = email;
                    toast.remove();
                }, 1500);
            }
        });

        // Password strength indicator
        document.getElementById('signupPassword').addEventListener('input', (e) => {
            const password = e.target.value;
            const strengthDiv = document.getElementById('passwordStrength');

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            const labels = ['', 'Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
            const colors = ['', '#f5576c', '#fa709a', '#fee140', '#43e97b', '#38f9d7'];

            strengthDiv.textContent = labels[strength] ? `Password strength: ${labels[strength]}` : '';
            strengthDiv.style.color = colors[strength] || '';
        });

        // Toggle between login and signup
        document.getElementById('showSignup').addEventListener('click', (e) => {
            e.preventDefault();
            showSection('signup');
        });

        document.getElementById('showLogin').addEventListener('click', (e) => {
            e.preventDefault();
            showSection('login');
        });

        // Forgot password
        document.getElementById('forgotPassword').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Password reset feature coming soon! For demo purposes, you can login with any email and password.');
        });

        // Social login placeholders
        document.getElementById('googleLogin').addEventListener('click', () => {
            alert('Google login integration coming soon! For demo, use the email/password form.');
        });

        document.getElementById('facebookLogin').addEventListener('click', () => {
            alert('Facebook login integration coming soon! For demo, use the email/password form.');
        });

        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize particles when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', createParticles);
        } else {
            createParticles();
        }
    </script>
</body>

</html>
